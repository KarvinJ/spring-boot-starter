services:

  ontology:

    image: spring-boot-starter:latest
    container_name: starter-container

    ports:
      - "8080:8080"

    networks:
      - starter-network

    depends_on:
      - mysqldb

  mysqldb:

    image: mysql:latest
    container_name: mysql-container

    networks:
      - starter-network

    environment:
      - MYSQL_DATABASE=starter
      - MYSQL_ROOT_PASSWORD=root

    volumes:
      - mysql_db:/var/lib/mysql

volumes:
  mysql_db:

networks:
  starter-network: