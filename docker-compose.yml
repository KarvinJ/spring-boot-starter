services:

  ontology:

    image: spring-boot-starter:latest
    container_name: starter-container

    ports:
      - "88:8080"

    networks:
      - ontology-network

    depends_on:
      - mysqldb

  mysqldb:

    image: mysql:latest
    container_name: docker-mysql-user

    networks:
      - ontology-network

    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=user_details

    volumes:
      - mysql_db:/var/lib/mysql

volumes:
  mysql_db:

networks:
  ontology-network: